name: Build and Deploy Staging (Admin)

on:
  push:
    branches: [staging]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: Staging
    steps:
      - uses: actions/checkout@v3

      - name: Prepare Image Tag
        id: prep
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "tag=ghcr.io/${REPO_LOWER}:staging" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Debug Build Args
        run: |
          echo "URL: ${{ secrets.NEXT_PUBLIC_BACKEND_URL }}" | sed 's/./& /g' # print dengan spasi agar tidak disensor GitHub tapi kita bisa liat ada isinya

      - name: Build and Push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ghcr.io/dwi-wahyu/canteeners-admin:staging
          build-args: |
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
            NEXT_PUBLIC_BACKEND_URL=${{ secrets.NEXT_PUBLIC_BACKEND_URL }}
            NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}
            # Sensitive vars TIDAK dipass di sini

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: Staging
    steps:
      - name: Prepare Image Tag
        id: prep
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "tag=ghcr.io/${REPO_LOWER}:staging" >> $GITHUB_OUTPUT

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        timeout-minutes: 20
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            export XDG_RUNTIME_DIR=/run/user/$(id -u)

            podman login ghcr.io -u dwi-wahyu -p ${{ secrets.GHCR_TOKEN }}

            # Pull images terbaru
            podman pull ghcr.io/dwi-wahyu/canteeners-admin:staging
            podman pull ghcr.io/dwi-wahyu/canteeners-migrator:staging

            # Restart pod dengan image terbaru
            podman kube down /var/www/canteeners/podman/staging/pod.yaml
            podman kube play /var/www/canteeners/podman/staging/pod.yaml

            # Jalankan migration
            podman run --rm \
              --pod canteeners-staging-pod \
              -e DATABASE_URL='postgresql://canteeners_staging:canteeners_staging123@localhost:5432/canteeners_staging?schema=public' \
              ghcr.io/dwi-wahyu/canteeners-migrator:staging \
              bunx prisma migrate deploy
